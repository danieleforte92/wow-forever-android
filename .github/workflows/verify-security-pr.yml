name: Verify security PR

on:
  push:
    branches:
      - security/https-credentials-hardening

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - name: Run unit tests
        run: ./gradlew --no-daemon testModernDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleModernDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wow-forever-security-pr-debug
          path: app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
